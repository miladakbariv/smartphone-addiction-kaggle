<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Model ROC-AUC comparison</title>
  <desc id="desc">Bar chart comparing baseline and final model ROC-AUC scores for the smartphone addiction project.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 28px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
    .axis { font: 14px Arial, sans-serif; fill: #374151; }
    .label { font: 15px Arial, sans-serif; fill: #111827; }
    .value { font: 700 14px Arial, sans-serif; fill: #111827; }
    .note { font: 13px Arial, sans-serif; fill: #6b7280; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .bar { fill: #9ca3af; }
    .bar-final { fill: #2563eb; }
    .bar-public { fill: #16a34a; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="520" rx="18"/>
  <text x="48" y="50" class="title">Independent model performance</text>
  <text x="48" y="78" class="subtitle">Kaggle Playground Series S6E8 - 5-fold CV and Public LB ROC-AUC</text>

  <line x1="220" y1="430" x2="950" y2="430" class="grid"/>
  <line x1="220" y1="360" x2="950" y2="360" class="grid"/>
  <line x1="220" y1="290" x2="950" y2="290" class="grid"/>
  <line x1="220" y1="220" x2="950" y2="220" class="grid"/>
  <line x1="220" y1="150" x2="950" y2="150" class="grid"/>
  <line x1="220" y1="80" x2="950" y2="80" class="grid"/>

  <text x="172" y="434" class="axis">0.90</text>
  <text x="172" y="364" class="axis">0.92</text>
  <text x="172" y="294" class="axis">0.94</text>
  <text x="172" y="224" class="axis">0.96</text>
  <text x="172" y="154" class="axis">0.98</text>
  <text x="172" y="84" class="axis">1.00</text>

  <text x="48" y="126" class="label">Logistic Regression</text>
  <text x="48" y="186" class="label">CatBoost</text>
  <text x="48" y="246" class="label">LightGBM</text>
  <text x="48" y="306" class="label">Raw XGBoost</text>
  <text x="48" y="366" class="label">Final XGBoost + structural + TE</text>
  <text x="48" y="426" class="label">Independent Kaggle Public LB</text>

  <rect x="220" y="102" width="80.143" height="28" rx="8" class="bar"/>
  <rect x="220" y="162" width="374.220" height="28" rx="8" class="bar"/>
  <rect x="220" y="222" width="420.161" height="28" rx="8" class="bar"/>
  <rect x="220" y="282" width="445.382" height="28" rx="8" class="bar"/>
  <rect x="220" y="342" width="474.180" height="28" rx="8" class="bar-final"/>
  <rect x="220" y="402" width="484.470" height="28" rx="8" class="bar-public"/>

  <text x="310" y="121" class="value">0.91145 CV</text>
  <text x="604" y="181" class="value">0.95346 CV</text>
  <text x="650" y="241" class="value">0.96002 CV</text>
  <text x="675" y="301" class="value">0.96363 CV</text>
  <text x="704" y="361" class="value">0.96774 CV</text>
  <text x="714" y="421" class="value">0.96921 Public LB</text>

  <text x="48" y="486" class="note">Blue = best independently developed cross-validation model - Green = independently achieved Kaggle public leaderboard score</text>
</svg>
